name: Build standalone releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            # Raw exe ships directly — no archive, no chmod needed.
            dist_file: "AutoEvalBot.exe"
            asset_file: "AutoEvalBot-Windows-x64.exe"
          - name: Linux-x64
            os: ubuntu-latest
            dist_file: "AutoEvalBot"
            asset_file: "AutoEvalBot-Linux-x64.tar.gz"
          - name: macOS-arm64
            os: macos-latest
            dist_file: "AutoEvalBot"
            asset_file: "AutoEvalBot-macOS-arm64.tar.gz"
          - name: macOS-x64
            # Intel Macs (older hardware). If GitHub retires this runner
            # image, this one job fails but the other three still publish
            # (fail-fast: false) — just re-run with an updated image name.
            os: macos-15-intel
            dist_file: "AutoEvalBot"
            asset_file: "AutoEvalBot-macOS-x64.tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          python -m PyInstaller --onefile --console --clean --noconfirm
          --name AutoEvalBot
          --collect-all selenium --collect-submodules webdriver_manager
          auto_eval.py

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv "dist/${{ matrix.dist_file }}" "dist/${{ matrix.asset_file }}"
            ls -lh dist/
          else
            chmod +x "dist/${{ matrix.dist_file }}"
            INNER="AutoEvalBot"
            mv "dist/${{ matrix.dist_file }}" "dist/${INNER}"
            tar -czf "dist/${{ matrix.asset_file }}" -C dist "${INNER}"
            rm "dist/${INNER}"
            ls -lh dist/
            tar -tzf "dist/${{ matrix.asset_file }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_file }}
          path: dist/${{ matrix.asset_file }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only cut a Release on tag pushes (v1.0.0, ...).
    # Manual runs (workflow_dispatch) still build + upload artifacts
    # for inspection without publishing a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File | How to run |
            |---|---|---|
            | Windows 10/11 (64-bit) | `AutoEvalBot-Windows-x64.exe` | Download and double-click. Needs Google Chrome installed. If SmartScreen warns, click **More info → Run anyway**. |
            | Linux (64-bit) | `AutoEvalBot-Linux-x64.tar.gz` | `tar -xzf AutoEvalBot-Linux-x64.tar.gz && chmod +x AutoEvalBot && ./AutoEvalBot`. Needs Google Chrome installed. |
            | macOS Apple Silicon | `AutoEvalBot-macOS-arm64.tar.gz` | `tar -xzf AutoEvalBot-macOS-arm64.tar.gz && chmod +x AutoEvalBot && ./AutoEvalBot`. Needs Google Chrome installed. On first run, right-click → Open to clear Gatekeeper. |
            | macOS Intel | `AutoEvalBot-macOS-x64.tar.gz` | Same as above on Intel Macs. |

            No Python or pip needed — everything is bundled. Only Google Chrome is required (the bot drives it via Selenium).
